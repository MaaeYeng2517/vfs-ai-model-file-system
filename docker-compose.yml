version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: vfs
      POSTGRES_PASSWORD: vfs
      POSTGRES_DB: vfs
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000","9001:9001"]
    volumes: [miniodata:/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://vfs:vfs@postgres:5432/vfs
      MINIO_ENDPOINT: minio:9000
    ports: ["8000:8000"]
    depends_on: [postgres, minio]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
  miniodata:
